bullets:
  - Utilized two data encoding techniques, Discrete Encoding and Ranged Encoding, to align the open-source CKD datasets (CKD15 and CKD21) with inconsistent feature types for model training.
  - Investigated multiple feature selection techniques and a unified feature selection approach to identify the optimal number of features for training and evaluating various classifiers.
  - "Proposed a novel ensemble classifier, Tri-phase Ensemble, combining Voting, Bagging, and Stacking techniques, and compared its performance with base classifiers."
  - Implemented two Multi-layer Ensemble Classifiers using blending and stacking approaches, with interchanged layers to monitor their performance and robustness.
  - Applied explainable AI to understand and interpret the predictions made by the machine learning models.
